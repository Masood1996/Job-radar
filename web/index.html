<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>Pharma Job Radar</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e8eef8}main{max-width:1200px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.muted{color:#91a0b7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.job{background:#121b2d;border:1px solid #26334a;border-radius:16px;padding:16px}.num{font-size:28px;font-weight:800}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,select,button{background:#111a2a;color:#e8eef8;border:1px solid #31415d;border-radius:10px;padding:10px}button{cursor:pointer}.jobs{display:grid;gap:10px}.job{display:grid;grid-template-columns:1fr auto;gap:12px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#22324f;font-size:12px;margin:2px}.green{background:#164b37}.orange{background:#594018}.red{background:#51262d}.link{color:#8ec5ff}.small{font-size:13px}</style></head><body><main><section class="hero"><div><h1>📡 Pharma Job Radar</h1><div class="muted">Germany · Poland · Romania · Qatar · QC/QA/GMP</div></div><button id="notify">Enable notifications</button></section><div class="cards" style="margin-top:20px"><div class="card"><div class="muted">Companies</div><div class="num" id="companies">50</div></div><div class="card"><div class="muted">New matches</div><div class="num" id="new">0</div></div><div class="card"><div class="muted">Tracked jobs</div><div class="num" id="jobs">0</div></div><div class="card"><div class="muted">Last scan</div><div class="num small" id="scan">Not yet</div></div></div><div class="controls"><input id="search" placeholder="Search company, role, keyword..."><select id="country"><option value="">All countries</option><option>Germany</option><option>Poland</option><option>Romania</option><option>Qatar</option></select><select id="status"><option value="">All statuses</option><option>new</option><option>applied</option><option>interview</option><option>offer</option><option>rejected</option></select><button id="clear">Clear filters</button></div><h2>🔥 Matching vacancies</h2><div id="jobsList" class="jobs"></div><h2 style="margin-top:28px">🏭 50-company radar</h2><div id="companiesList" class="jobs"></div></main><script src="app.js"></script></body></html>
