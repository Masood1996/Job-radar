name: Pharma Job Radar Scan
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r monitor/requirements.txt
      - name: Scan careers
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor/monitor.py
      - name: Publish updated data
        run: |
          git config user.name 'Pharma Job Radar Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/jobs.json
          git commit -m 'Update job radar data' || true
          git push
